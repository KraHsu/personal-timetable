name: Test and deploy timetable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timetable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://timetable.krahsu.top
    steps:
      - uses: actions/checkout@v4
      - name: Package application (no data or credentials)
        run: |
          printf '%s\n' "$GITHUB_SHA" > REVISION
          tar -czf release.tar.gz server.py public REVISION
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/timetable_ci
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy release over SSH (port 22222)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for attempt in 1 2 3; do
            if ssh -T -p 22222 -i ~/.ssh/timetable_ci \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" < release.tar.gz; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify public HTTPS and deployed commit
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            https://timetable.krahsu.top/healthz -o health.json
          python3 - <<'PY'
          import json, os
          health = json.load(open('health.json'))
          assert health['ok'] and health['revision'] == os.environ['GITHUB_SHA'], health
          print('HTTPS serves commit', health['revision'])
          PY
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/timetable_ci
