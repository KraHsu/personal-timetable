server {
    listen 80;
    listen [::]:80;
    server_name timetable.krahsu.top;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name timetable.krahsu.top;
    # Existing, auto-renewed wildcard certificate covers *.krahsu.top.
    ssl_certificate /www/sites/blog.krahsu.top/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/blog.krahsu.top/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 500k;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
