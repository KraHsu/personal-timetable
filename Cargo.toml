[package]
name = "timetable-server"
version = "2.0.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.11", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4"
pbkdf2 = "0.12.2"
sha2 = "0.10.9"
hmac = "0.12.1"
hex = "0.4"
rand = "0.9"
subtle = "2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
