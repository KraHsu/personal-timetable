<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eff1f5"><meta name="robots" content="noindex,nofollow">
  <title>课间 · 我的课表</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css"><script type="module" src="./app.mjs"></script>
</head>
<body>
  <div class="page">
    <header class="masthead"><a class="wordmark" href="./"><span class="mark">课</span>课间<span class="wordmark-en"> / timetable</span></a><nav aria-label="页面操作"><button id="theme" class="icon-button" aria-label="切换深浅主题">◐</button><button id="settings-button" class="text-button">学期设置 <span aria-hidden="true">↗</span></button></nav></header>
    <main>
      <section class="intro"><div><p class="eyebrow" id="semester-label">MY TIMETABLE</p><h1>有课的日子，<br class="mobile-break">也留一点空白。</h1><p class="intro-note" id="term-note">把时间交还给眼前的事。</p></div><button id="add-course" class="primary"><span aria-hidden="true">＋</span> 添加课程</button></section>
      <section id="next-up" class="next-up" aria-label="接下来的课程"></section>
      <section class="schedule-section" aria-label="课程安排">
        <div class="toolbar"><div class="week-nav"><button id="prev-week" class="icon-button" aria-label="上一周">←</button><button id="week-picker-button" class="week-title" aria-label="选择周次"><span id="week-title">本周</span><span class="chevron">⌄</span></button><button id="next-week" class="icon-button" aria-label="下一周">→</button><button id="this-week" class="today-button">回到本周</button></div><div class="view-switch" aria-label="视图"><button id="week-view" aria-pressed="true">周课表</button><button id="list-view" aria-pressed="false">日程</button></div></div>
        <div class="schedule-meta"><span id="week-range"></span><span id="week-count"></span></div>
        <div id="schedule"></div>
      </section>
      <section class="course-index"><div class="section-heading"><h2>我的课程 <span id="course-count">00</span></h2><button class="text-button" id="preview-button">看看示例 ↗</button></div><div id="course-list"></div></section>
    </main>
    <footer><span>课间 <span class="footer-dot">·</span> 一周，一页，从容一点。</span><div><span id="save-state" role="status">正在读取课表…</span><button id="logout" class="text-button" hidden>退出编辑</button></div></footer>
  </div>
  <dialog id="course-dialog" aria-labelledby="course-dialog-title"><form id="course-form"><div class="dialog-heading"><div><p class="eyebrow">COURSE</p><h2 id="course-dialog-title">添加课程</h2></div><button type="button" class="icon-button close" aria-label="关闭">×</button></div><input type="hidden" name="id"><label>课程名称<input name="name" required maxlength="80" placeholder="例如：线性代数"></label><div class="form-row"><label>上课地点<input name="location" maxlength="120" placeholder="教学楼 / 教室 / 线上"></label><label>授课老师<input name="teacher" maxlength="80" placeholder="选填"></label></div><label>课程标记<select name="color"><option value="green">草木绿</option><option value="blue">雾蓝</option><option value="mauve">浅紫</option><option value="peach">杏色</option><option value="rose">豆沙</option></select></label><div class="section-heading"><h3>上课安排</h3><button type="button" id="add-session" class="text-button">＋ 添加时段</button></div><p class="field-help">同一门课可有多个时段，各自设置周次和地点；时间待定时可移除所有时段。</p><div id="sessions"></div><label>备注<textarea name="notes" rows="3" maxlength="2000" placeholder="教材、课程链接，或其他需要记住的事"></textarea></label><p class="form-error" id="course-error" role="alert"></p><div class="dialog-actions"><button type="button" id="delete-course" class="danger text-button">删除课程</button><div class="action-right"><button type="button" class="secondary close">取消</button><button type="submit" class="primary">保存课程</button></div></div></form></dialog>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><div class="dialog-heading"><p class="eyebrow">COURSE NOTES</p><button class="icon-button close" aria-label="关闭">×</button></div><div id="detail-content"></div><div class="dialog-actions"><span></span><button id="edit-course" class="primary">编辑课程</button></div></dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><form id="settings-form"><div class="dialog-heading"><div><p class="eyebrow">SEMESTER</p><h2 id="settings-title">学期设置</h2></div><button type="button" class="icon-button close" aria-label="关闭">×</button></div><label>学期名称<input name="title" maxlength="80" required placeholder="例如：2026 · 秋季学期"></label><div class="form-row"><label>第一周的周一<input name="startDate" type="date" required></label><label>学期周数<input name="totalWeeks" type="number" min="1" max="60" required></label></div><label>课表时区<select name="timezone"><option value="Asia/Shanghai">中国标准时间 · UTC+8</option><option value="America/Los_Angeles">美国洛杉矶</option><option value="Europe/London">英国伦敦</option><option value="Asia/Tokyo">日本东京</option><option value="UTC">UTC</option></select></label><p class="field-help">当前周和下一节课始终按课表时区计算。</p><div class="form-row"><label>课表起始时间<input name="dayStart" type="time" required></label><label>课表结束时间<input name="dayEnd" type="time" required></label></div><p class="field-help">超出显示时间的课程会自动扩展课表，不会隐藏。</p><p id="settings-error" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary close">取消</button><button type="submit" class="primary">保存设置</button></div><div class="backup"><span>课表备份</span><button type="button" id="export" class="text-button">导出 JSON ↗</button><button type="button" id="import" class="text-button">导入备份 ↗</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></form></dialog>
  <dialog id="login-dialog" aria-labelledby="login-title"><form id="login-form"><div class="dialog-heading"><div><p class="eyebrow">JUST FOR YOU</p><h2 id="login-title">进入编辑</h2></div><button type="button" class="icon-button close" aria-label="关闭">×</button></div><p class="field-help">输入你的课表密码，在任何设备上管理同一份课程安排。</p><label>课表密码<input name="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="form-error" role="alert"></p><div class="dialog-actions"><span></span><button type="submit" class="primary">继续 →</button></div></form></dialog>
  <dialog id="week-dialog" aria-labelledby="week-dialog-title"><div class="dialog-heading"><h2 id="week-dialog-title">选择周次</h2><button class="icon-button close" aria-label="关闭">×</button></div><div id="weeks-grid"></div></dialog>
  <div id="toast" role="status" hidden></div>
</body></html>
